name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end smoke test
        run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npm run db:start

      - name: Rebuild database from migrations and seed
        run: npm run db:reset

      - name: Lint database schema
        run: npm run db:lint

      - name: Run database tests
        run: npm run db:test

      - name: Run local authentication integration tests
        run: npm run test:auth

      - name: Run local authorization integration tests
        run: npm run test:authorization

      - name: Run local academic configuration integration tests
        run: npm run test:academic-config

      - name: Run local student-management integration tests
        run: npm run test:students

      - name: Run local teacher-assignment integration tests
        run: npm run test:teacher-assignments

      - name: Verify generated database types
        run: |
          npm run db:types
          npx prettier --write src/types/database.generated.ts
          git diff --exit-code -- src/types/database.generated.ts

      - name: Install Chromium for authentication tests
        run: npx playwright install --with-deps chromium

      - name: Run local authentication browser tests
        run: npm run test:e2e:auth

      - name: Run local authorization browser tests
        run: npm run test:e2e:authorization

      - name: Run local academic configuration browser tests
        run: npm run test:e2e:academic-config

      - name: Run local student-management browser tests
        run: npm run test:e2e:students

      - name: Run local teacher-assignment browser tests
        run: npm run test:e2e:teacher-assignments

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop -- --no-backup
