name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check patch whitespace
        run: git diff --check

      - name: Report dependency audit
        run: |
          npm audit --audit-level=critical
          npm audit --omit=dev --audit-level=critical

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test

      - name: Run report-card PDF renderer tests
        run: npm run test:report-pdf

      - name: Install Poppler for PDF visual regression
        env:
          POPPLER_VERSION: 24.02.0-1ubuntu9.9
        run: |
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/poppler"
          curl -fsSL "https://security.ubuntu.com/ubuntu/pool/main/p/poppler/poppler-utils_${POPPLER_VERSION}_amd64.deb" -o "$RUNNER_TEMP/poppler/poppler-utils.deb"
          curl -fsSL "https://security.ubuntu.com/ubuntu/pool/main/p/poppler/libpoppler134_${POPPLER_VERSION}_amd64.deb" -o "$RUNNER_TEMP/poppler/libpoppler134.deb"
          sudo apt-get install -y "$RUNNER_TEMP/poppler/libpoppler134.deb" "$RUNNER_TEMP/poppler/poppler-utils.deb"
          pdftoppm -v
          pdfinfo -v

      - name: Run report-card PDF visual regression
        run: npm run test:visual:report-pdf

      - name: Build production application
        run: npm run build

      - name: Verify traced report-card font assets
        run: npm run verify:report-pdf-trace

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end smoke test
        run: npm run test:e2e

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npm run db:start

      - name: Rebuild database from migrations and seed
        run: npm run db:reset

      - name: Lint database schema
        run: npm run db:lint

      - name: Run database tests
        run: npm run db:test

      - name: Run local authentication integration tests
        run: npm run test:auth

      - name: Run local authorization integration tests
        run: npm run test:authorization

      - name: Run local academic configuration integration tests
        run: npm run test:academic-config

      - name: Run local student-management integration tests
        run: npm run test:students

      - name: Run local teacher-assignment integration tests
        run: npm run test:teacher-assignments

      - name: Run local marks-entry integration tests
        run: npm run test:marks-entry

      - name: Run local marks-workflow integration tests
        run: npm run test:marks-workflow

      - name: Run local results-engine integration tests
        run: npm run test:results-engine

      - name: Run local report-snapshot integration tests
        run: npm run test:report-snapshots

      - name: Run report-card PDF renderer tests
        run: npm run test:report-pdf

      - name: Run report publication integration tests
        run: npm run test:report-publication

      - name: Run deterministic report publication concurrency tests
        run: npm run test:report-publication:concurrency

      - name: Verify generated database types
        run: |
          npm run db:types
          npx prettier --write src/types/database.generated.ts
          git diff --exit-code -- src/types/database.generated.ts

      - name: Install Chromium for authentication tests
        run: npx playwright install --with-deps chromium

      - name: Install pinned Poppler for PDF browser extraction
        env:
          POPPLER_VERSION: 24.02.0-1ubuntu9.9
        run: |
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/poppler"
          curl -fsSL "https://security.ubuntu.com/ubuntu/pool/main/p/poppler/poppler-utils_${POPPLER_VERSION}_amd64.deb" -o "$RUNNER_TEMP/poppler/poppler-utils.deb"
          curl -fsSL "https://security.ubuntu.com/ubuntu/pool/main/p/poppler/libpoppler134_${POPPLER_VERSION}_amd64.deb" -o "$RUNNER_TEMP/poppler/libpoppler134.deb"
          sudo apt-get install -y "$RUNNER_TEMP/poppler/libpoppler134.deb" "$RUNNER_TEMP/poppler/poppler-utils.deb"
          pdftoppm -v
          pdfinfo -v

      - name: Run local authentication browser tests
        run: npm run test:e2e:auth

      - name: Run local authorization browser tests
        run: npm run test:e2e:authorization

      - name: Run local academic configuration browser tests
        run: npm run test:e2e:academic-config

      - name: Run local student-management browser tests
        run: npm run test:e2e:students

      - name: Run local teacher-assignment browser tests
        run: npm run test:e2e:teacher-assignments

      - name: Run local marks-entry browser tests
        run: npm run test:e2e:marks-entry

      - name: Run local marks-workflow browser tests
        run: npm run test:e2e:marks-workflow

      - name: Run local results-engine browser tests
        run: npm run test:e2e:results-engine

      - name: Run local report-snapshot browser tests
        run: npm run test:e2e:report-snapshots

      - name: Run local report-card PDF browser tests
        run: npm run test:e2e:report-pdf

      - name: Run local report publication browser tests
        run: npm run test:e2e:report-publication

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop -- --no-backup
